name: Gmail Triage

on:
  schedule:
    # Every hour at :15 UTC (not :00 — GitHub often delays/drops top-of-hour jobs
    # due to load). Dedup via the "Triaged" label keeps frequent runs safe.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without creating drafts"
        type: boolean
        default: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node index.js
